version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: barbershop_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: barbershop123
      MYSQL_DATABASE: barbershop
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: ['mysqld', '--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci', '--default-authentication-plugin=mysql_native_password']
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pbarbershop123"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: barbershop_backend
    restart: unless-stopped
    environment:
      - DB_NAME=barbershop
      - DB_USER=root
      - DB_PASSWORD=barbershop123
      - DB_HOST=db
      - DB_PORT=3306
      - DEBUG=True
      - SECRET_KEY=django-insecure-production-key-change-me
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  frontend:
    build: ./frontend
    container_name: barbershop_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev

volumes:
  mysql_data:
