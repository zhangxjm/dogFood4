version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: visitor_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: visitor_db
      MYSQL_USER: visitor
      MYSQL_PASSWORD: visitor123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data:
