version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: food_order_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: food_order
    volumes:
      - mongodb_data:/data/db
    networks:
      - food_order_network

volumes:
  mongodb_data:

networks:
  food_order_network:
    driver: bridge
