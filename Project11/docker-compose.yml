services:
  mysql:
    image: mysql:8.0
    container_name: charging_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: charging_station
      MYSQL_USER: charging
      MYSQL_PASSWORD: charging123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - charging_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucharging", "-pcharging123"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: charging_redis
    restart: always
    ports:
      - "6380:6379"
    command: redis-server --requirepass redis123456
    volumes:
      - redis_data:/data
    networks:
      - charging_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: charging_backend
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - charging_network
    environment:
      - DB_HOST=charging_mysql
      - DB_PORT=3306
      - DB_USER=charging
      - DB_PASSWORD=charging123
      - DB_NAME=charging_station
      - REDIS_HOST=charging_redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis123456

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: charging_frontend
    restart: always
    ports:
      - "8082:80"
    depends_on:
      - backend
    networks:
      - charging_network

volumes:
  mysql_data:
  redis_data:

networks:
  charging_network:
    driver: bridge
