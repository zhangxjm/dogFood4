services:
  mysql:
    image: mysql:8.0
    container_name: interest_class_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: interest_class
      MYSQL_USER: interest
      MYSQL_PASSWORD: interest123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - interest_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interest_class_backend
    command: sh -c "chmod +x entrypoint.sh && ./entrypoint.sh"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - interest_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: interest_class_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - interest_network

volumes:
  mysql_data:

networks:
  interest_network:
    driver: bridge
