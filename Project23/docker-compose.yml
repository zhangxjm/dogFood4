version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gym-reservation-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: gym_reservation
      MYSQL_USER: gym
      MYSQL_PASSWORD: gym123456
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - gym-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gym-reservation-backend
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gym_reservation?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: gym
      SPRING_DATASOURCE_PASSWORD: gym123456
    networks:
      - gym-network
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gym-reservation-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - gym-network

networks:
  gym-network:
    driver: bridge

volumes:
  mysql_data:
