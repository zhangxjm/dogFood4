version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: doc_collab_postgres
    environment:
      POSTGRES_USER: docuser
      POSTGRES_PASSWORD: docpass123
      POSTGRES_DB: doc_collab
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: doc_collab_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
