version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: pet_foster_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: pet_foster
      MYSQL_USER: pet_user
      MYSQL_PASSWORD: pet123456
      LANG: C.UTF-8
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pet-network
    command: ['mysqld', '--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pet_foster_backend
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pet-network
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=pet_user
      - DB_PASSWORD=pet123456
      - DB_NAME=pet_foster

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pet_foster_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - pet-network

volumes:
  mysql_data:

networks:
  pet-network:
    driver: bridge
