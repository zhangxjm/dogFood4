{{template "header.html" .}}

<div class="page-header">
    <h2>编辑出勤记录</h2>
    <a href="/attendance/records" class="btn btn-secondary">返回列表</a>
</div>

{{if .error}}
<div class="alert alert-danger">
    {{.error}}
</div>
{{end}}

<form action="/attendance/records/edit/{{.record.ID}}" method="POST" class="form">
    <div class="form-group">
        <label for="worker">选择工人 <span class="required">*</span></label>
        <select id="worker" name="worker_id" required>
            {{range .workers}}
            <option value="{{.ID}}" {{if eq .ID $.record.WorkerID}}selected{{end}}>{{.WorkerNo}} - {{.Name}}</option>
            {{end}}
        </select>
    </div>
    
    <div class="form-group">
        <label for="date">日期 <span class="required">*</span></label>
        <input type="date" id="date" name="date" value="{{.record.Date.Format "2006-01-02"}}" required>
    </div>
    
    <div class="form-group">
        <label for="check_in">签到时间</label>
        <input type="time" id="check_in" name="check_in" value="{{.record.CheckIn}}">
    </div>
    
    <div class="form-group">
        <label for="check_out">签退时间</label>
        <input type="time" id="check_out" name="check_out" value="{{.record.CheckOut}}">
    </div>
    
    <div class="form-group">
        <label for="status">状态</label>
        <select id="status" name="status">
            <option value="正常" {{if eq .record.Status "正常"}}selected{{end}}>正常</option>
            <option value="迟到" {{if eq .record.Status "迟到"}}selected{{end}}>迟到</option>
            <option value="早退" {{if eq .record.Status "早退"}}selected{{end}}>早退</option>
            <option value="加班" {{if eq .record.Status "加班"}}selected{{end}}>加班</option>
            <option value="请假" {{if eq .record.Status "请假"}}selected{{end}}>请假</option>
            <option value="旷工" {{if eq .record.Status "旷工"}}selected{{end}}>旷工</option>
        </select>
    </div>
    
    <div class="form-group">
        <label for="remark">备注</label>
        <textarea id="remark" name="remark" rows="3">{{.record.Remark}}</textarea>
    </div>
    
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="/attendance/records" class="btn btn-secondary">取消</a>
    </div>
</form>

{{template "footer.html"}}
